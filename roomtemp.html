<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunday Service — Visual Instrument (local)</title>
<!-- Local copy: contains ABC Diatype Ultra (Dinamo). Its license forbids putting it on public servers — keep this file on your own machine. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;800;900&display=swap" rel="stylesheet">
<style>
/* ABC Diatype Ultra is used only if it is installed on this computer or loaded/embedded; otherwise Inter Tight Black stands in. */
@font-face{font-family:'SS Display';src:local('ABC Diatype Ultra'),local('ABCDiatype-Ultra');font-display:swap}
:root{
  --ff:'Inter Tight',system-ui,sans-serif;
  --fd:'SSUser','SS Display','Inter Tight','Helvetica Neue',Arial,sans-serif;
  --bg:#000; --ink:#f1ede6; --dim:rgba(241,237,230,.48); --faint:rgba(241,237,230,.14); --hair:rgba(241,237,230,.12);
  --glass:rgba(10,10,11,.78); --acc:#ffd34d;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--ink);font-family:var(--ff);overflow:hidden;font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
#c{display:block;cursor:crosshair}
.ui{transition:opacity .35s}
body.hide .ui{opacity:0;pointer-events:none}
#hud{position:fixed;left:22px;top:18px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);pointer-events:none;line-height:1.7}
#hud b{color:var(--ink);font-family:var(--fd);font-weight:900;letter-spacing:.06em;font-size:15px}
#rec{position:fixed;right:22px;top:18px;font-size:12px;letter-spacing:.14em;color:#ff5a4d;display:none}
#toast{position:fixed;left:50%;top:22px;transform:translateX(-50%);background:var(--ink);color:#000;padding:9px 16px;border-radius:30px;font-size:12px;letter-spacing:.02em;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;max-width:80vw;text-align:center}
#toast.show{opacity:1}
/* ---------- bar ---------- */
#bar{position:fixed;left:0;right:0;bottom:0;height:150px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--hair);display:flex;align-items:stretch;overflow-x:auto;overflow-y:hidden;z-index:5}
#bar::-webkit-scrollbar{height:0}
.blk{display:flex;flex-direction:column;justify-content:center;gap:8px;padding:0 20px;border-right:1px solid var(--hair);flex:0 0 auto}
.lab{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.seg{display:flex;flex-direction:column;gap:4px}
.seg button,.pill{background:none;border:1px solid var(--faint);border-radius:30px;padding:6px 14px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;color:var(--dim);white-space:nowrap}
.seg button:hover,.pill:hover{color:var(--ink);border-color:var(--dim)}
.seg button.on,.pill.on{background:var(--ink);color:#000;border-color:var(--ink)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.acts button{background:none;border:1px solid var(--faint);border-radius:6px;padding:5px 8px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;color:var(--dim)}
.acts button:hover{color:var(--ink);border-color:var(--dim)}
.acts button.on{background:var(--acc);color:#000;border-color:var(--acc)}
#inkRow{display:none;align-items:center;gap:8px}
#inkRow.show{display:flex}
#inkSw{display:flex;gap:4px;align-items:center}
#inkSw button{width:18px;height:18px;border-radius:50%;border:1px solid var(--faint);cursor:pointer;padding:0}
#inkSw button.on{outline:2px solid var(--acc);outline-offset:1px}
#inkSw .auto{width:auto;padding:0 8px;border-radius:10px;font-size:9px;letter-spacing:.14em;text-transform:uppercase;background:none;color:var(--dim)}
#inkSw .auto.on{color:var(--ink)}
.swc{display:flex;flex-direction:column;align-items:center;gap:4px}
.lk{width:14px;height:12px;border:none;background:none;color:var(--dim);font-size:9px;cursor:pointer;padding:0;line-height:1}
.lk.on{color:var(--acc)}
#palShuf{background:none;border:1px solid var(--faint);border-radius:20px;color:var(--dim);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;padding:3px 9px;cursor:pointer}
#palShuf:hover{color:var(--ink);border-color:var(--dim)}
.knobs{display:flex;gap:14px;align-items:center}
.knob{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:ns-resize;user-select:none;touch-action:none;width:66px}
.knob svg{display:block}
.knob .v{font-size:14px;font-family:var(--fd);font-weight:900;font-feature-settings:"tnum" 1}
.knob .k{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.knob:hover .k{color:var(--ink)}
#day{width:230px}
#dayRow{display:flex;align-items:baseline;justify-content:space-between}
#dayVal{font-size:28px;font-family:var(--fd);font-weight:900;letter-spacing:-.01em;font-feature-settings:"tnum" 1}
.tl{position:relative;height:30px;cursor:ew-resize;touch-action:none}
.tl .track{position:absolute;left:0;right:0;top:13px;height:3px;border-radius:3px;background:linear-gradient(90deg,#f6d6c5,#ffd27a,#ff8a3d,#d7317a,#4a2ad6,#090a3a)}
.tl .thumb{position:absolute;top:6px;width:2px;height:18px;background:var(--ink);transform:translateX(-1px)}
.tl .ticks{position:absolute;left:0;right:0;top:20px;display:flex;justify-content:space-between;font-size:9px;color:var(--dim);letter-spacing:.1em;padding-top:2px}
.chk{display:flex;gap:10px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.chk label{display:flex;gap:5px;align-items:center;cursor:pointer}
.chk input{accent-color:#f1ede6;margin:0}
#dialWrap{display:flex;align-items:center;gap:14px}
#dial{cursor:grab;touch-action:none;user-select:none}
.srcs{display:flex;flex-direction:column;gap:4px}
.srcs button{background:none;border:none;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);cursor:pointer;text-align:left;padding:2px 0}
.srcs button.on{color:var(--acc)}
.pal{display:flex;gap:5px}
.sw{width:26px;height:32px;border-radius:5px;border:1px solid var(--faint);cursor:grab;position:relative}
.sw.drag{opacity:.4}
.meters{display:flex;gap:5px;align-items:flex-end;height:44px}
.mt{width:7px;height:100%;background:var(--faint);border-radius:2px;position:relative;overflow:hidden}
.mt i{position:absolute;left:0;right:0;bottom:0;background:var(--ink)}
#beatDot{width:9px;height:9px;border-radius:50%;background:var(--acc);opacity:0;margin-bottom:2px}
select.min{background:transparent;border:1px solid var(--faint);border-radius:20px;padding:5px 10px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}
select.min option{background:#111}
.big{background:var(--ink);color:#000;border:none;border-radius:30px;padding:9px 18px;font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;cursor:pointer}
.big.rec{background:none;color:#ff5a4d;border:1px solid #ff5a4d}
.big.rec.live{background:#ff5a4d;color:#000}
.big.ghost{background:none;color:var(--ink);border:1px solid var(--faint)}
/* ---------- drawer ---------- */
#drawer{position:fixed;top:0;right:0;bottom:150px;width:390px;background:rgba(10,10,11,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-left:1px solid var(--hair);transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.7,.2,1);z-index:6;display:flex;flex-direction:column}
#drawer.open{transform:none}
#tabs{display:flex;flex-wrap:wrap;gap:2px 16px;padding:18px 22px 12px;border-bottom:1px solid var(--hair)}
#tabs button{background:none;border:none;padding:4px 0;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);cursor:pointer;border-bottom:1px solid transparent}
#tabs button.on{color:var(--ink);border-color:var(--ink)}
#pane{flex:1;overflow-y:auto;padding:8px 22px 40px}
#pane::-webkit-scrollbar{width:6px}#pane::-webkit-scrollbar-thumb{background:var(--faint);border-radius:6px}
.h{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.h::after{content:'';flex:1;height:1px;background:var(--hair)}
.row{display:grid;grid-template-columns:118px 1fr 44px;align-items:center;gap:10px;min-height:30px}
.row label{font-size:12px;color:var(--dim)}
.row output{font-size:11px;text-align:right}
.row.two{grid-template-columns:118px 1fr}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:rgba(241,237,230,.3)}
input[type=range]::-moz-range-track{height:1px;background:rgba(241,237,230,.3)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--ink);margin-top:-6px;border:none}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--ink);border:none}
input[type=text]{background:transparent;border:none;border-bottom:1px solid var(--faint);padding:6px 0;font-size:13px;width:100%;outline:none}
input[type=text]:focus{border-color:var(--ink)}
.note{font-size:11.5px;color:var(--dim);line-height:1.55;margin:8px 0}
.note b{color:var(--ink);font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.look{border:1px solid var(--faint);border-radius:8px;padding:10px 12px;cursor:pointer;position:relative;min-height:66px;display:flex;flex-direction:column;justify-content:space-between}
.look:hover{border-color:var(--dim)}
.look.on{border-color:var(--ink)}
.look .n{font-size:14px;font-family:var(--fd);font-weight:900}
.look .key{position:absolute;right:10px;top:9px;font-size:10px;color:var(--dim)}
.look .strip{height:5px;border-radius:3px;margin-top:8px}
.look .x{position:absolute;right:9px;bottom:20px;color:var(--dim);font-size:13px;display:none}
.look.user:hover .x{display:block}
.palrow{display:flex;align-items:center;gap:10px;padding:7px 0;cursor:pointer;border-bottom:1px solid var(--hair)}
.palrow:hover .pn{color:var(--ink)}
.palrow .ps{display:flex;flex:0 0 130px;height:18px;border-radius:3px;overflow:hidden}
.palrow .ps i{flex:1}
.palrow .pn{font-size:12px;color:var(--dim)}
#curve{width:100%;aspect-ratio:1;border:1px solid var(--faint);border-radius:6px;display:block;touch-action:none;cursor:crosshair;background:#060607}
.ctabs{display:flex;gap:6px;margin:6px 0}
.posgrid{display:grid;grid-template-columns:repeat(3,28px);gap:4px}
.posgrid button{width:28px;height:22px;border:1px solid var(--faint);background:none;border-radius:4px;cursor:pointer}
.posgrid button.on{background:var(--ink)}
.prow{display:grid;grid-template-columns:1fr 54px 1fr 40px;align-items:center;gap:10px;min-height:32px}
.prow .pl{font-size:12px;color:var(--dim)}
.prow .fm{height:4px;background:var(--faint);border-radius:2px;overflow:hidden}
.prow .fm i{display:block;height:100%;background:var(--ink);width:0}
.prow output{font-size:11px;text-align:right}
.mood{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0}
.mood div{border:1px solid var(--hair);border-radius:6px;padding:8px}
.mood span{display:block;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.mood b{font-size:18px;font-weight:400}
.prog{height:3px;background:var(--faint);border-radius:3px;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;width:0;background:var(--ink)}
kbd{font-family:var(--ff);font-size:10px;border:1px solid var(--faint);border-radius:3px;padding:0 5px;color:var(--ink)}
.fontname{font-size:26px;margin:4px 0 4px;font-family:var(--fd);font-weight:900}
@media (max-width:760px){#drawer{width:100%}}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="hud" class="ui"><b>SUNDAY SERVICE</b><br><span id="hudTxt"></span></div>
<div id="rec">● REC 00:00</div>
<div id="toast"></div>

<div id="bar" class="ui">
  <div class="blk">
    <div class="seg" id="engineSeg"><button data-e="film">Film</button><button data-e="cym">Cymatics</button><button data-e="both">Both</button></div>
  </div>
  <div class="blk">
    <div class="acts">
      <button id="aDrop" title="Drop ink tool (D): select it, then click or drag on the image to drop ink. Pick a color below.">Drop ink</button>
      <button id="aBurn" title="Burn tool (B): select it, then click the image to start a burn that eats through the film and spreads.">Burn a hole</button>
      <button id="aWash" title="Clear ink (W): wipes all ink, water and burns — back to clean paper / film. The light colors stay.">Clear ink</button>
      <button id="aDev" title="Freeze ink: holds the ink and burns exactly as they are (no more dripping or spreading). Click again to let them move.">Freeze ink</button>
      <button id="aThrow" title="Scatter tool (G): select it, then click or drag on the image to blast the sand away; it settles back into the pattern.">Scatter sand</button>
      <button id="aSeed" title="New seed: re-rolls the random layout of the light fields, film bands and textures.">New seed</button>
    </div>
    <div id="inkRow"><span class="lab">Ink</span><div id="inkSw"></div></div>
  </div>
  <div class="blk" id="day">
    <div id="dayRow"><span class="lab">Day</span><span id="dayVal">14:00</span></div>
    <div class="tl" id="dayTl"><div class="track"></div><div class="thumb" id="dayThumb"></div><div class="ticks"><span>06</span><span>12</span><span>18</span><span>24</span></div></div>
    <div class="chk"><label><input type="checkbox" id="dayClock">follow clock</label><label><input type="checkbox" id="director">auto-director</label></div>
  </div>
  <div class="blk" id="filmKnobs"><div class="knobs" id="fk"></div></div>
  <div class="blk" id="cymBlk"><div id="dialWrap"><svg id="dial" width="128" height="128" viewBox="0 0 128 128"></svg><div class="srcs" id="srcs"></div><div class="knobs" id="ck"></div></div></div>
  <div class="blk"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><span class="lab">Palette</span><button id="palShuf" title="Randomize the palette (Shift+R). Locked colors (●) are kept.">⚄ Random</button></div><div class="pal" id="palStrip"></div></div>
  <div class="blk">
    <span class="lab">Sound</span>
    <div style="display:flex;gap:12px;align-items:flex-end">
      <div class="meters"><div class="mt"><i id="mB"></i></div><div class="mt"><i id="mM"></i></div><div class="mt"><i id="mH"></i></div><div class="mt"><i id="mE"></i></div><div id="beatDot"></div></div>
      <select class="min" id="srcSel"><option value="off">Off</option><option value="mic">Mic / line</option><option value="file">Audio file…</option><option value="demo">Demo pulse</option></select>
    </div>
  </div>
  <div class="blk">
    <div style="display:flex;gap:8px"><button class="big" id="bPng" title="S">Save</button><button class="big rec" id="bRec" title="V">Rec</button></div>
    <div style="display:flex;gap:8px"><button class="big ghost" id="bDrawer" title="A">≡ More</button><button class="big ghost" id="bHide" title="H">Hide</button></div>
  </div>
</div>

<div id="drawer" class="ui">
  <div id="tabs"></div>
  <div id="pane"></div>
</div>

<audio id="audioEl" loop></audio>
<input type="file" id="fileAudio" accept="audio/*" hidden>
<input type="file" id="fileLooks" accept=".json,application/json" hidden>
<input type="file" id="fileFont" accept=".otf,.ttf,.woff,.woff2,font/*" hidden>
<input type="color" id="colorPick" style="position:fixed;left:-100px;opacity:0">
<div id="p5host" style="position:fixed;left:-99999px;top:0;width:10px;height:10px;overflow:hidden"></div>

function fftMag(re){ const n=re.length,im=new Float32Array(n);
  for(let i=1,j=0;i<n;i++){let bit=n>>1;for(;j&bit;bit>>=1)j^=bit;j^=bit;if(i<j){const t=re[i];re[i]=re[j];re[j]=t;}}
  for(let len=2;len<=n;len<<=1){const ang=-2*Math.PI/len,wr=Math.cos(ang),wi=Math.sin(ang);
    for(let i=0;i<n;i+=len){let cr=1,ci=0;for(let k=0;k<len/2;k++){const ar=re[i+k],ai=im[i+k],br=re[i+k+len/2]*cr-im[i+k+len/2]*ci,bi=re[i+k+len/2]*ci+im[i+k+len/2]*cr;
      re[i+k]=ar+br;im[i+k]=ai+bi;re[i+k+len/2]=ar-br;im[i+k+len/2]=ai-bi;const ncr=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=ncr;}}}
  const m=new Float32Array(n/2);for(let i=0;i<n/2;i++)m[i]=Math.hypot(re[i],im[i])/n;return m; }
function featuresAt(buf,t,dt){
  const N=4096,sr=buf.sampleRate,ch=buf.getChannelData(0),st=Math.floor(t*sr);
  const td=new Float32Array(N),re=new Float32Array(N);
  for(let i=0;i<N;i++){const v=ch[st+i]||0;td[i]=v;re[i]=v*(.5-.5*Math.cos(2*Math.PI*i/(N-1)));}
  const m=fftMag(re),fb=new Uint8Array(N/2),fdb=new Float32Array(N/2);

  return analyze(fb,fdb,td,sr,N,dt,t);
}

    tick(dt,i*dt,ext);

function oklch(L,C,h){h*=Math.PI/180;const a=C*Math.cos(h),b=C*Math.sin(h);
  const l=(L+.3963377774*a+.2158037573*b)**3,m=(L-.1055613458*a-.0638541728*b)**3,q=(L-.0894841775*a-1.2914855480*b)**3;

function randomPalette(){
  const rnd=Math.random,H=rnd()*360;
  const schemes=[[0,25,50,-30],[0,15,180,200],[0,120,240,60],[0,150,210,30],[30,55,190,205],[0,40,80,280]];
  const sc=schemes[Math.floor(rnd()*schemes.length)];
  const Ls=[.42,.6,.74,.88].sort(()=>rnd()-.5); if(rnd()<.45)Ls[Math.floor(rnd()*4)]=.26+rnd()*.1;
  const cols=sc.map((o,i)=>oklch(Ls[i],.11+rnd()*.11,(H+o+(rnd()-.5)*16+360)%360));
  let ground;
  if(S.engine==='cym')ground=oklch(.08+rnd()*.06,.01+rnd()*.03,H);
  else if(S.paper>.5||rnd()<.5)ground=oklch(.95+rnd()*.03,.01+rnd()*.025,(H+40)%360);
  else ground=oklch(.12+rnd()*.08,.02+rnd()*.04,(H+180)%360);
  const next=[ground,...cols];
  for(let i=0;i<5;i++)if(!R.palLock[i])S.pal[i]=next[i];
  R.fade=null;syncPal();titleDirty=true;refreshTextures();
}

function bindCurve(cv){

  for(const ch of ['r','g','b','rgb']){const f=monotone(S.curves[ch]);c.strokeStyle=col[ch];c.globalAlpha=ch===curveCh?1:.2;c.lineWidth=ch===curveCh?3.5:2;c.beginPath();for(let i=0;i<=120;i++){const x=i/120,y=clamp(f(x),0,1);i?c.lineTo(x*w,(1-y)*h):c.moveTo(x*w,(1-y)*h);}c.stroke();}

  p.appendChild(el('div','note','<kbd>Space</kbd> pause · <kbd>H</kbd> hide UI · <kbd>F</kbd> fullscreen · <kbd>A</kbd> drawer · <kbd>S</kbd> PNG · <kbd>V</kbd> record · <kbd>1</kbd>–<kbd>9</kbd> looks · <kbd>←</kbd><kbd>→</kbd> frequency presets · <kbd>↑</kbd><kbd>↓</kbd> semitone · <kbd>D</kbd> ink tool · <kbd>B</kbd> burn tool · <kbd>G</kbd> scatter tool · <kbd>Esc</kbd> no tool · <kbd>W</kbd> clear ink · <kbd>R</kbd> new seed · <kbd>Shift</kbd>+<kbd>R</kbd> random palette'));
}

  slider(p,'bands','Film bands',0,1.5,.01);slider(p,'blob','Field scale',.3,3,.01);slider(p,'bokeh','Dots',0,1,.01);slider(p,'halation','Halation',0,1.5,.01);slider(p,'diffuse','Diffusion',0,1,.01);

let rT=null;const refreshSoon=()=>{clearTimeout(rT);rT=setTimeout(()=>refreshTextures(),250);};

/* keys */
document.addEventListener('keydown',e=>{
  const a=document.activeElement; if(a&&(a.tagName==='TEXTAREA'||(a.tagName==='INPUT'&&a.type==='text')))return;
  const k=e.key.toLowerCase();
  if(k===' '){e.preventDefault();R.playing=!R.playing;toast(R.playing?'Playing':'Paused',900);}
  else if(k==='h')toggleHide();
  else if(k==='escape'){if(R.tool){R.tool=null;syncTools();}else if(document.body.classList.contains('hide'))toggleHide();else toggleDrawer(false);}
  else if(k==='a'||k==='tab'){e.preventDefault();toggleDrawer();if($('#drawer').classList.contains('open')){buildTabs();buildPane();}}
  else if(k==='f'){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>toast('Fullscreen is blocked here — press H to hide the interface'));else document.exitFullscreen?.();}
  else if(k==='s')savePNG();
  else if(k==='v')$('#bRec').click();
  else if(k==='r'&&e.shiftKey)randomPalette();
  else if(k==='r')$('#aSeed').click();
  else if(k==='d'&&S.engine!=='cym')setTool('ink');
  else if(k==='b'&&S.engine!=='cym')setTool('burn');
  else if(k==='g'&&S.engine!=='film')setTool('sand');
  else if(k==='w')R.wash=1;
  else if(k==='arrowright'||k==='arrowleft'){e.preventDefault();const dir=k==='arrowright'?1:-1;let i=FREQ_PRESETS.findIndex(f=>f>=S.freq-1);if(i<0)i=FREQ_PRESETS.length-1;if(FREQ_PRESETS[i]!==Math.round(S.freq)&&dir<0)i++;i=clamp(i+dir,0,FREQ_PRESETS.length-1);S.freq=FREQ_PRESETS[i];}
  else if(k==='arrowup'||k==='arrowdown'){e.preventDefault();S.freq=clamp(S.freq*Math.pow(2,(k==='arrowup'?1:-1)/12),S.fmin,S.fmax);}
  else if(/^[1-9]$/.test(k))goLook(+k-1);
});
document.addEventListener('fullscreenchange',()=>setTimeout(()=>{if(S.aspect==='fill'){W=0;setSize(S.quality,true);}else fit();},80));
$('#bDrawer').addEventListener('click',()=>{buildTabs();buildPane();});

/* ============================== boot ============================== */
setSize(S.quality);
initParticles();
curvesChanged();
syncUI();syncSrcBtns();
bootFont();
if(!FLOAT_OK)toast('This GPU lacks float render targets — running a reduced version without sand',6000);
// develop the first frame so it already looks finished
{const P=derive();const nd=Math.round(S.bleed*10);for(let i=0;i<nd;i++)queueDrop(null,.8);for(let i=0;i<40;i++)stepSim(P,1,1/60);stepParticles(P,modeFor(R.hz),40);}
requestAnimationFrame(t=>{R.last=t;loop(t);});
window.__SS={stepSim,stepParticles,queueDrop,S:()=>S,R,A,goLook,setDay,tick,savePNG,useDemo,syncUI,offlineRender,modeFor,derive};
})();
